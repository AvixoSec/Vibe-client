[package]
name = "vibe_dumper"
version = "0.1.0"
edition = "2021"
authors = ["Avixo"]
description = "JVMTI/JNI runtime class dumper for encrypted RustMe classes"

[lib]
name = "vibe_dumper_v11"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test_dumper"
path = "src/bin/test_dumper.rs"

[dependencies]

[profile.release]
opt-level = 2
lto = true
strip = true
